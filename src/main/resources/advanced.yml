# 修改本文件前请注意：
#
# 绝大多数情况下，修改这里会导致问题。
# 除非你非常清楚自己在做什么，否则不建议改动。
# 若出现误判，请向我们反馈，我们会修复。
# 修改前请检查 Intave 控制台是否有警告或说明。
# 以下检测可考虑封禁：
#   - AttackRaytrace.reach 在 VL 200
#   - Heuristics 在 VL 100
# 有问题可在 Discord 联系我们。

version: "14.0.0"
state: 0

check:
  physics:
    # 大幅放宽物理检测
    #   通常不需要开启，开启后玩家更容易作弊
    #   误判请反馈
    high-tolerance: false

    # 缓解模式
    #   可选：AGGRESSIVE、CAREFUL、LENIENT、BARELY、SILENT
    #   误判请反馈
    mitigation: BARELY

    # 是否检测 NoSlowdown 类作弊？
    enforce-item-slowdown: true

    # 关闭速度包的 tick 宽松处理
    no-speculative-velocity: true

    # 关闭 Ping 包与对应 attach 包的捆绑
    no-bundling: false

    on-detection:
      # 有助于减少物品相关误判
      reset-item-usage: true
      # 有助于减少背包相关误判
      # 设为 "SILENT" 可在静默缓解模式下关闭背包
      close-inventory: true
      # 有助于减少幽灵方块相关误判
      refresh-nearby-blocks: true

    # 请勿封禁
    thresholds:
      100: "intave internals sendnotify &c{player}&7/{trust-color}&7 移动异常"
      400: "intave internals sendnotify &c{player}&7/{trust-color}&7 移动异常 #2"
      500: "intave internals storelog {player} {check} {vl}"
      999:
        - $kick$

  timer:
    # 若玩家不向服务器发包，是否暂停对其的出站包
    # 对战斗中 Blink 非常有效
    reverse-blink: true

    # 允许玩家落后服务器 tick 的最大 tick 数（即 blink），-1 为禁用
    # 较激进：3 秒 = 60 ticks
    blink-limit: -1

    # 是否拦截脉冲式 blink？
    block-pulse-blink: true

    thresholds:
      50: "intave internals sendnotify &c{player}&7/{trust-color}&7 正在加速游戏"
      75: "intave internals sendnotify &c{player}&7/{trust-color}&7 正在加速游戏 #2"
      100:
        - $kick$

  heuristics:
    enabled: true

    # 各经典检测类型的违规分增长
    # - 必须为整数，-1 关闭该检测
    # - 0 仍启用检测并应用战斗削弱，但不增加违规分
    classic:
      # 攻击启发式
      attack-accuracy: 4
      attack-required: 3
      pre-attack: 4

      # 视角启发式
      rotation-accuracy: 4
      rotation-exact: 10
      rotation-snap: 5
      rotation-sensitivity: -1
      rotation-reset: 3

      # 其他
      inventory-rotations: 2
      blocking: 0
      no-swing: 0
      swing-order: 3
      sprint-toggles: 2 # 防止刷疾跑包以对目标施加更大击退
      tool-switch: 3 # 防止挖方块时切换物品栏

      thresholds:
        20:
          - "intave internals storelog {player} {check} {vl}"
          - "intave internals sendnotify &e{player}&7 攻击行为可疑 #1"

        40:
          - "intave internals sendnotify &e{player}&7 攻击行为可疑 #2"

        50:
          - "intave internals storelog {player} {check} {vl}"
          - "intave internals sendnotify &c{player}&7/{trust-color}&7 因攻击行为可疑被踢出（本地经典启发式）"
          - $kick$

    cloud:
      thresholds:
        50:
          - "intave internals storelog {player} {check} {vl}"
          - "intave internals sendnotify &c{player}&7/{trust-color}&7 因攻击行为可疑被移出（云端启发式）"
          - $kick$

  attackraytrace:
    enabled: true
    applicable-thresholds:
      # 高 VL 时踢出
      reach:
        50: "intave internals sendnotify &c{player}&7/{trust-color}&7 攻击行为可疑（超距）"
        150:
          - "intave internals storelog {player} {check} {vl}"
          - "intave internals sendnotify &c{player}&7/{trust-color}&7 因攻击行为可疑被移出（超距）"
          - $kick$

      # 一般无需执行处罚
      hitbox:
        50: "intave internals sendnotify &c{player}&7/{trust-color}&7 攻击行为可疑（碰撞箱）"
        100: "intave internals sendnotify &c{player}&7/{trust-color}&7 攻击行为可疑 #2（碰撞箱）"

      # 一般无需封禁
      timeout:
        50: "intave internals sendnotify &c{player}&7/{trust-color}&7 攻击行为可疑（疑似 backtrack）"
        100: "intave internals sendnotify &c{player}&7/{trust-color}&7 攻击行为可疑 #2（疑似 backtrack）"

  interactionraytrace:
    enabled: true
    # 一般无需封禁
    thresholds:
      50: "intave internals sendnotify &c{player}&7/{trust-color}&7 交互行为可疑"
      100: "intave internals sendnotify &c{player}&7/{trust-color}&7 交互行为可疑 #2"

  clickpatterns:
    enabled: true
    # 请勿执行封禁，只能踢出
    thresholds:
      50: "intave internals sendnotify &c{player}&7/{trust-color}&7 点击统计异常（连点）"
      100:
        - "intave internals sendnotify &c{player}&7/{trust-color}&7 因点击统计异常被移出（连点）"
        - $kick$

  clickspeedlimiter:
    enabled: true
    max-cps: 20
    thresholds:
      50: "intave internals sendnotify &c{player}&7/{trust-color}&7 攻击过快"
      100:
        - "intave internals sendnotify &c{player}&7/{trust-color}&7 因攻击过快被移出"
        - $kick$

  breakspeedlimiter:
    enabled: true
    # 一般无需执行处罚
    thresholds:
      100: "intave internals sendnotify &c{player}&7/{trust-color}&7 破坏方块过快"

  protocolscanner:
    enabled: true
    invokant: false
    check_sent_slot_twice_vl: 100
    packet-order-vl: 5
    thresholds:
      50: "intave internals sendnotify &c{player}&7/{trust-color}&7 发送无效数据包"
      100:
        - "intave internals sendnotify &c{player}&7/{trust-color}&7 因发送无效数据包被移出"
        - $kick$

  placementanalysis:
    enabled: true
    check_timings: false

    # 5 秒窗口内累计视角旋转上限
    # 用于抑制高强度高旋转搭路类作弊
    # 特定情况下 Intave 会从此值再扣减最多 1250 度
    # 360 度 = 完整一圈
    rotation-limit: 3000

    cloud-thresholds:
      # 本地分析失败时执行
      on-premise:
        200:
          - "intave internals storelog {player} {check} {vl}"
          - "intave internals sendnotify &c{player}&7/{trust-color}&7 因可疑放置方块被移出（搭路）"
          - $kick$

      # 云端分析失败时执行
      cloud:
        200:
          - "intave internals storelog {player} {check} {vl}"
          - "intave internals sendnotify &c{player}&7/{trust-color}&7 因可疑放置方块被移出（云端启发式）"
          - $kick$

  inventoryclickanalysis:
    enabled: true
    high-tolerance: true
    # 请勿执行封禁，只能踢出
    thresholds:
      50: "intave internals sendnotify &c{player}&7/{trust-color}&7 执行无效物品操作"
      100:
        - "intave internals sendnotify &c{player}&7/{trust-color}&7 因可疑物品点击被移出"
        - $kick$

cloud:
  # 是否连接云端？
  enabled: false

  features:
    # 是否用云端存储元数据？
    cloud-storage: true
    # 是否用云端获取信任等级？
    cloud-trustfactor: true
    # 是否用云端做额外作弊检测？
    cloud-heuristics: true
    # 是否用云端存储日志？
    cloud-logs: true

storage:
  # 忽略 "intave internals storelog"，改为自动存储建议违规
  auto-logs: false

  # 跨服切换时是否尝试恢复 VL？
  recover-vl: true

blacklist:
  apply: true
  message-in-chat: false
  message: "&c你在反作弊黑名单中，无法加入本服务器"

proxy:
  enable: false

clientwarning:
  enable: true

compatibility:
  # 位置反馈同步强制
  # 若需兼容 GuardSpigot 可关闭
  # 此选项可防止重生飞行
  position-feedback-sync-enforcement: true

  # 记分板有时不可见时开启
  ignore-scoreboard-packets: false

  # 开启不影响安全性，但可能让调试网络流量的作弊者更容易发现 Intave
  no-transaction-obfuscation: false

command:
  hide: true
  reroute:
    "/alerts": "/intave verbose"
    "/cps": "/intave cps"

  # 修复：关闭命令隐藏与重定向，
  # 但可修复 1.12 下 Tab 补全命令会踢人的问题
  fix-tab-kicks: false

rejoin:
  # 生产环境请勿关闭
  delay: 3600
  refresh: true
  message: "&c你刚被移出不久，请稍后再连接"

# 仅在出现严重问题且已向我们反馈后，
# 才应关闭下列选项。
# 任意关闭都可能严重降低安全性与稳定性。
fault-kicks:
  position-faults: true
  missing-position-update: true
  feedback-faults: true
  ignoring-feedback: true
  ignoring-keep-alive: true
  invalid-key-input: true
  invalid-player-action: true
  inventory-faults: true

# 从部分数据包中移除可轻微增强作弊的数据
filter:
  equipmentdata: false
  health: true
  # 若代理踢人异常可关闭 vanish
  vanish: true

logging:
  # 是否将日志写入文件？
  file-log: true

  # 控制台是否显示信任等级变化？
  trustfactor: true
  # 控制台是否显示加入时的客户端版本？
  client-version: true
  # 控制台是否显示命令执行？
  command-execution: true
  # 控制台是否显示故障踢出？
  fault-kicks: true
  # 控制台是否输出玩家日志 ID？
  cloud-log-ids: true
  # 详细模式（ALL、MITIGATED、SELECTED）
  verbose-mode: MITIGATED

  # 调试用，请勿开启
  #feedback-dump: false

analytics:
  errorReporting: true
  usageReporting: true

layout:
  verbose: "{prefix} &c{player}&7/{trust-color}&7 {message} {details} (+{vladded} -> {vl})"
  notify: "{prefix} &c&l通知&8: &7{text}"
  prefix: "&8[&c&lIntave&8]&7 "
